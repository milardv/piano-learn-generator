name: transcribe
# La PWA retrouve son job grâce au request_id dans le nom du run
run-name: "${{ inputs.request_id }} · ${{ inputs.query || inputs.youtube_url || inputs.file }}"

# Déclenché par la PWA (API workflow_dispatch) : une recherche « Artiste - Titre », une URL YouTube
# ou un fichier déjà poussé dans uploads/
on:
  workflow_dispatch:
    inputs:
      query:
        description: Recherche « Artiste - Titre » (premier résultat YouTube)
        required: false
      youtube_url:
        description: URL YouTube
        required: false
      file:
        description: Chemin d'un audio dans uploads/ (enregistrement micro)
        required: false
      mode:
        description: song = chanson -> reprise piano ; piano = transcription d'un enregistrement de piano
        type: choice
        options: [song, piano]
        default: song
      id:
        description: Identifiant du morceau (sinon id YouTube ou nom du fichier)
        required: false
      title:
        description: Titre
        required: false
      cover:
        description: URL de la pochette
        required: false
      request_id:
        description: Identifiant fourni par la PWA pour suivre le job
        required: false

permissions:
  contents: write

# Un seul job à la fois : évite les conflits de push sur songs/
concurrency:
  group: transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # Fournit les « PO tokens » exigés par YouTube aux IP de datacenter
      bgutil:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports:
          - 4416:4416
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les entrées
        env:
          QUERY: ${{ inputs.query }}
          URL: ${{ inputs.youtube_url }}
          FILE: ${{ inputs.file }}
        run: |
          count=0
          for v in "$QUERY" "$URL" "$FILE"; do [ -n "$v" ] && count=$((count + 1)); done
          if [ "$count" -ne 1 ]; then echo "::error::Renseigner exactement un champ parmi query, youtube_url, file"; exit 1; fi
          case "$FILE" in ""|uploads/*) ;; *) echo "::error::file doit être dans uploads/"; exit 1;; esac

      # Binaire précompilé : apt-get peut rester bloqué de longues minutes sur les runners
      - name: Installer ffmpeg
        uses: AnimMouse/setup-ffmpeg@v1
        timeout-minutes: 5

      # yt-dlp a besoin d'un moteur JavaScript pour déchiffrer les formats YouTube
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Cache des modèles Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-pop2piano

      # Partitions MIDI (Lakh clean_midi, 230 Mo) : consultées avant de passer par l'audio
      - name: Cache des partitions
        uses: actions/cache@v4
        with:
          path: ~/.cache/piano-worker
          key: lakh-clean-midi

      - name: Installer le worker
        working-directory: worker
        run: uv sync --extra cloud

      - name: Cookies YouTube (optionnel)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "PIANO_YT_COOKIES=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Transcrire
        working-directory: worker
        env:
          QUERY: ${{ inputs.query }}
          URL: ${{ inputs.youtube_url }}
          FILE: ${{ inputs.file }}
          MODE: ${{ inputs.mode }}
          SONG_ID: ${{ inputs.id }}
          TITLE: ${{ inputs.title }}
          COVER: ${{ inputs.cover }}
        run: |
          args=(--out-dir ../songs --mode "${MODE:-song}")
          if [ -n "$QUERY" ]; then args+=(--search "$QUERY")
          elif [ -n "$URL" ]; then args+=(--youtube "$URL")
          else args+=(--file "../$FILE"); fi
          if [ -n "$SONG_ID" ]; then args+=(--id "$SONG_ID"); fi
          if [ -n "$TITLE" ]; then args+=(--title "$TITLE"); fi
          if [ -n "$COVER" ]; then args+=(--cover "$COVER"); fi
          uv run piano-worker "${args[@]}"

      - name: Publier le morceau
        env:
          FILE: ${{ inputs.file }}
        run: |
          git config user.name "piano-coach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # L'enregistrement n'est plus utile une fois transcrit
          if [ -n "$FILE" ]; then git rm -q "$FILE"; fi
          git add songs/
          git commit -m "Ajouter un morceau transcrit"
          git pull --rebase -q
          git push

  deploy:
    needs: transcribe
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
